<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Practice Test 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <header class="app-header">
            <div class="top-titles">
                TRƯỜNG ĐẠI HỌC ĐÀ LẠT<br>
                TRUNG TÂM NGOẠI NGỮ VÀ ĐÀO TẠO NGUỒN NHÂN LỰC<br>
                TÀI LIỆU ÔN KỸ NĂNG NGHE - BẬC 5/6 - Tháng 2/2026
            </div>
            <div class="test-selector-container" style="text-align: center; margin-top: 1rem;">
                <h1 style="margin-bottom: 0.5rem; display: inline-block; margin-right: 1rem;" id="test-title">Practice test 1</h1>
                <select id="test-selector" style="font-size: 1rem; padding: 0.3rem 0.5rem; border: 1px solid #000; background: #fff;">
                    <option value="test1">Practice Test 1</option>
                    <option value="test2">Practice Test 2</option>
                    <option value="test3">Practice Test 3</option>
                    <option value="test4">Practice Test 4</option>
                    <option value="test5">Practice Test 5</option>
                    <hr>
                    <option value="reading_test1">Practice Reading Test 1</option>
                    <option value="reading_test2">Practice Reading Test 2</option>
                    <option value="reading_test3">Practice Reading Test 3</option>
                    <hr>
                    <option value="writing_test">Practice Writing Test (All Tasks)</option>
                </select>
                <button id="btn-shuffle" style="font-size: 1rem; padding: 0.3rem 0.8rem; margin-left: 1rem; border: 1px solid #000; background: #fff; cursor: pointer;" title="Xáo đề Listening: mỗi lần tự động chọn các part chưa làm, buộc làm đủ 5 lần để bao phủ toàn bộ">Xáo đề Listening</button>
                <span id="listening-progress" style="font-size: 0.9rem; color: #555; margin-left: 0.3rem;"></span>
                <button id="btn-restore" style="font-size: 1rem; padding: 0.3rem 0.8rem; margin-left: 0.3rem; border: 1px solid #000; background: #fff; cursor: pointer; display: none;" title="Khôi phục đề gốc và xóa tiến trình xáo listening">Khôi phục Listening</button>
                <button id="btn-shuffle-reading" style="font-size: 1rem; padding: 0.3rem 0.8rem; margin-left: 1rem; border: 1px solid #000; background: #fff; cursor: pointer;" title="Xáo đề Reading: mỗi lần tự động chọn các passage chưa làm, buộc làm đủ 3 lần để bao phủ toàn bộ">Xáo đề Reading</button>
                <span id="reading-progress" style="font-size: 0.9rem; color: #555; margin-left: 0.3rem;"></span>
                <button id="btn-restore-reading" style="font-size: 1rem; padding: 0.3rem 0.8rem; margin-left: 0.3rem; border: 1px solid #000; background: #fff; cursor: pointer; display: none;" title="Khôi phục đề gốc và xóa tiến trình xáo reading">Khôi phục Reading</button>
            </div>
        </header>

        <main id="test-container"></main>

        <div class="score-display" id="score-display"></div>

        <div class="action-bar">
            <button class="btn" id="btn-check">Check Answers</button>
            <button class="btn" id="btn-retry">Clear & Retry</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
